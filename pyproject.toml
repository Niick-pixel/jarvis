[project]
name = "jarvis"
version = "0.1.0"
description = "A local-first AI workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
    "nvidia-ml-py>=12.560",
    "huggingface-hub>=0.26",
    "psutil>=6.1",
    # M4 (PLAN.md section 6.2): knowledge and memory.
    "GitPython>=3.1",
    "markdown-it-py>=3.0",
    "numpy>=2.1",
    "watchdog>=6.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# M5 (PLAN.md 6.2, 1.5): speech in and out. Optional because a text-only install has no reason to
# carry an ONNX runtime, and because both engines refuse to run without weights you fetched.
voice = [
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["server"]
ignore_missing_imports = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
